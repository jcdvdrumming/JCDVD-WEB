<div class="section-inner contacto-container">
  <div class="header-section">
    <span class="section-index">04 — Contacto</span>
    <h2 class="section-title">Contacto</h2>
    <p class="section-subtitle">Hablemos de música, sonido o tu próxima clase</p>
  </div>

  <div class="contacto-content">
    <div class="contact-info">
      <a href="https://wa.me/5493446517773" target="_blank" rel="noopener noreferrer" class="contact-card">
        <div class="icon-circle" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
            </path>
          </svg>
        </div>
        <div class="card-text">
          <h3 class="card-label">WhatsApp</h3>
          <p>(+54) 3446-517773</p>
        </div>
      </a>

      <a href="https://www.instagram.com/jcdvdrumming/" target="_blank" rel="noopener noreferrer" class="contact-card">
        <div class="icon-circle" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.5" y2="6.5"></line>
          </svg>
        </div>
        <div class="card-text">
          <h3 class="card-label">Instagram</h3>
          <p>&#64;jcdvdrumming</p>
        </div>
      </a>

      <a href="mailto:jcdvdrumming@gmail.com" class="contact-card">
        <div class="icon-circle" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </div>
        <div class="card-text">
          <h3 class="card-label">Email</h3>
          <p>jcdvdrumming&#64;gmail.com</p>
        </div>
      </a>
    </div>

    <form class="contact-form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="contact-name">Tu nombre</label>
        <input id="contact-name" #nameField name="name" type="text" autocomplete="name" spellcheck="false"
          placeholder="Ej.: Juan Cruz…" [(ngModel)]="name" />
      </div>

      <div class="form-group">
        <label for="contact-message">Mensaje</label>
        <textarea id="contact-message" #messageField name="message" autocomplete="off"
          placeholder="Contame qué necesitás…" [(ngModel)]="message"></textarea>
      </div>

      @if (error) {
      <p class="form-error" role="alert">{{ error }}</p>
      }

      <button class="submit-btn" type="submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        Enviar por WhatsApp
      </button>
    </form>
  </div>

  <footer class="site-footer">
    <span>© 2026 JCDV Drumming</span>
    <span>Baterista Profesional &amp; Drum Doctor</span>
  </footer>
</div>
